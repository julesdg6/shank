[tool.pytest.ini_options]
testpaths = ["api/tests", "worker/tests", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.mypy]
python_version = "3.11"
files = ["api/main.py", "api/mcp_server.py"]
ignore_missing_imports = true
check_untyped_defs = true
explicit_package_bases = true
