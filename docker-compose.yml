services:
  shank-api:
    build: ./api
    ports:
      - "8088:8080"
    environment:
      - DATA_DIR=/srv/shank/data
    volumes:
      - ./data:/srv/shank/data
    networks:
      - shank-net

  shank-worker:
    build: ./worker
    environment:
      - DATA_DIR=/srv/shank/data
    volumes:
      - ./data:/srv/shank/data
    networks:
      - shank-net

networks:
  shank-net:
    driver: bridge
