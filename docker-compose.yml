services:
  shank:
    build: .
    ports:
      - "8088:8080"
    environment:
      - DATA_DIR=/srv/shank/data
      - POLL_INTERVAL=10
      - ACE_STEP_API_URL=${ACE_STEP_API_URL:-}
      - ACE_STEP_API_KEY=${ACE_STEP_API_KEY:-}
      - ACE_STEP_STEMS=${ACE_STEP_STEMS:-vocals,drums,bass,other}
    volumes:
      - ./data:/srv/shank/data
    networks:
      - shank-net

networks:
  shank-net:
    driver: bridge
