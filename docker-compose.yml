services:
  shank:
    build: .
    ports:
      - "8088:8080"
    environment:
      - DATA_DIR=/srv/shank/data
      - POLL_INTERVAL=10
      - STEM_BACKEND=${STEM_BACKEND:-auto}
      - ACE_STEP_API_URL=${ACE_STEP_API_URL:-}
      - ACE_STEP_API_KEY=${ACE_STEP_API_KEY:-}
      - ACE_STEP_STEMS=${ACE_STEP_STEMS:-vocals,drums,bass,other}
      - AUDIO_SEPARATOR_MODEL=${AUDIO_SEPARATOR_MODEL:-htdemucs_ft.yaml}
      - AUDIO_SEPARATOR_MODEL_DIR=${AUDIO_SEPARATOR_MODEL_DIR:-/srv/shank/models/separator}
      - AUDIO_SEPARATOR_DEVICE=${AUDIO_SEPARATOR_DEVICE:-cpu}
      - DEMUCS_MODEL=${DEMUCS_MODEL:-htdemucs}
      - DEMUCS_DEVICE=${DEMUCS_DEVICE:-cpu}
      - MT3_ENABLED=${MT3_ENABLED:-false}
      - MT3_SERVICE_URL=${MT3_SERVICE_URL:-http://127.0.0.1:8090}
      - MT3_MODEL=${MT3_MODEL:-multi_instrument}
      - TRANSCRIPTION_BACKEND=${TRANSCRIPTION_BACKEND:-basic_pitch}
      - MODEL_CACHE_DIR=${MODEL_CACHE_DIR:-/srv/shank/models/transcription}
      - MT3_DEVICE=${MT3_DEVICE:-auto}
      - MT3_TIMEOUT=${MT3_TIMEOUT:-1800}
      - MT3_TRANSCRIBE_STEMS=${MT3_TRANSCRIBE_STEMS:-true}
      - MT3_FAIL_TASK_ON_ERROR=${MT3_FAIL_TASK_ON_ERROR:-false}
      - MT3_CHECKPOINT_ROOT=${MT3_CHECKPOINT_ROOT:-/srv/shank/models/mt3/checkpoints}
      - MT3_CACHE_DIR=${MT3_CACHE_DIR:-/srv/shank/cache/mt3}
      - MT3_OUTPUT_PATH=${MT3_OUTPUT_PATH:-/srv/shank/data/mt3}
    volumes:
      - ./data:/srv/shank/data
      - ./models/separator:/srv/shank/models/separator
      - ./models/transcription:/srv/shank/models/transcription
      - ./cache/mt3:/srv/shank/cache/mt3
      - ./models/mt3/checkpoints:/srv/shank/models/mt3/checkpoints:ro
    # Optional NVIDIA GPU runtime example:
    # gpus: all
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    networks:
      - shank-net

networks:
  shank-net:
    driver: bridge
